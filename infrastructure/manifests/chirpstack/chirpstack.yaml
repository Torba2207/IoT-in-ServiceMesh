apiVersion: v1
kind: ServiceAccount
metadata:
  name: chirpstack
  namespace: iot-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chirpstack-config
  namespace: iot-system
data:
  chirpstack.toml: |
    [logging]
      level = "info"

    [postgresql]
      dsn = "postgresql://chirpstack:chirpstack@postgres:5432/chirpstack?sslmode=disable"
      max_open_connections = 10
      min_idle_connections = 0

    [redis]
      servers = ["redis://redis:6379"]
      tls_enabled = false
      cluster_enabled = false

    [network]
      net_id = "000000"
      enabled_regions = ["eu868"]

    [api]
      bind = "0.0.0.0:8080"
      secret = "overridden-by-CHIRPSTACK__API__SECRET-env-var"

    [[regions]]
      name = "eu868"
      common_name = "EU868"

      [regions.gateway]
        force_gws_private = false

        [regions.gateway.backend]
          enabled = "mqtt"

          [regions.gateway.backend.mqtt]
            topic_prefix = "eu868"
            server = "tcp://mosquitto:1883"
            qos = 0

    [integration]
      enabled = ["mqtt"]

      [integration.mqtt]
        server = "tcp://mosquitto:1883"
        topic_prefix = "application"
        qos = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack
  namespace: iot-system
  labels:
    app: chirpstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirpstack
  template:
    metadata:
      labels:
        app: chirpstack
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-await: "enabled"
    spec:
      serviceAccountName: chirpstack
      containers:
        - name: chirpstack
          image: chirpstack/chirpstack:4
          args:
            - -c
            - /etc/chirpstack
          env:
            - name: CHIRPSTACK__API__SECRET
              valueFrom:
                secretKeyRef:
                  name: chirpstack-secret
                  key: api-secret
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/chirpstack
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: chirpstack-config
---
apiVersion: v1
kind: Service
metadata:
  name: chirpstack
  namespace: iot-system
spec:
  selector:
    app: chirpstack
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# NodePort to access the ChirpStack UI from your laptop
apiVersion: v1
kind: Service
metadata:
  name: chirpstack-ui
  namespace: iot-system
spec:
  type: NodePort
  selector:
    app: chirpstack
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
