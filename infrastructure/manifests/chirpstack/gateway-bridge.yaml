apiVersion: v1
kind: ServiceAccount
metadata:
  name: chirpstack-gateway-bridge
  namespace: iot-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chirpstack-gateway-bridge-config
  namespace: iot-system
data:
  chirpstack-gateway-bridge.toml: |
    [backend]
      type = "semtech_udp"

      [backend.semtech_udp]
        udp_bind = "0.0.0.0:1700"

    [integration]
      marshaler = "protobuf"

      [integration.mqtt]
        event_topic_template = "eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
        command_topic_template = "eu868/gateway/{{ .GatewayID }}/command/#"
        state_topic_template = "eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}"

        [integration.mqtt.auth]
          type = "generic"

          [integration.mqtt.auth.generic]
            server = "tcp://mosquitto:1883"
            qos = 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack-gateway-bridge
  namespace: iot-system
  labels:
    app: chirpstack-gateway-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirpstack-gateway-bridge
  template:
    metadata:
      labels:
        app: chirpstack-gateway-bridge
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: chirpstack-gateway-bridge
      containers:
        - name: chirpstack-gateway-bridge
          image: chirpstack/chirpstack-gateway-bridge:4
          args:
            - --config
            - /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
          ports:
            - name: udp-semtech
              containerPort: 1700
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/chirpstack-gateway-bridge
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: chirpstack-gateway-bridge-config
---
# ClusterIP for MQTT traffic (mesh-internal, TCP)
apiVersion: v1
kind: Service
metadata:
  name: chirpstack-gateway-bridge
  namespace: iot-system
spec:
  selector:
    app: chirpstack-gateway-bridge
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
---
# NodePort for the physical UG63 gateway (UDP, bypasses Linkerd)
apiVersion: v1
kind: Service
metadata:
  name: chirpstack-gateway-bridge-udp
  namespace: iot-system
spec:
  type: NodePort
  selector:
    app: chirpstack-gateway-bridge
  ports:
    - name: semtech-udp
      port: 1700
      targetPort: 1700
      protocol: UDP
      nodePort: 31700
