# NOTE: the postgres-credentials Secret is intentionally NOT defined here.
# It is created from the gitignored .env by playbooks/setup-all.yml (so the DB
# password never lands in git), before ArgoCD deploys this StatefulSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: iot-system
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS hstore;

    -- Custom table the Node-RED flow inserts decoded uplinks into and the
    -- iot-stat-reader/frontend read from. ChirpStack does not create this, so
    -- it must be seeded here or a fresh DB would reject every insert.
    CREATE TABLE IF NOT EXISTS device_uplinks (
        id          BIGSERIAL PRIMARY KEY,
        device_eui  TEXT NOT NULL,
        device_name TEXT,
        received_at TIMESTAMPTZ NOT NULL,
        f_port      SMALLINT,
        payload     JSONB
    );

    -- Emit a NOTIFY on every insert so iot-stat-reader's /uplinks/stream (SSE)
    -- can push live uplinks. main.py LISTENs on the 'new_uplink' channel.
    CREATE OR REPLACE FUNCTION notify_new_uplink() RETURNS trigger AS $$
    BEGIN
        PERFORM pg_notify('new_uplink', row_to_json(NEW)::text);
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS device_uplinks_notify ON device_uplinks;
    CREATE TRIGGER device_uplinks_notify
        AFTER INSERT ON device_uplinks
        FOR EACH ROW EXECUTE FUNCTION notify_new_uplink();
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: iot-system
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: iot-system
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
