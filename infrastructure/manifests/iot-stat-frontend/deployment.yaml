apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-stat-frontend
  namespace: iot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-stat-frontend
  namespace: iot-system
  labels:
    app: iot-stat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-stat-frontend
  template:
    metadata:
      labels:
        app: iot-stat-frontend
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: iot-stat-frontend
      containers:
        - name: iot-stat-frontend
          image: ghcr.io/torba2207/iot-stat-frontend:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iot-stat-frontend
  namespace: iot-system
spec:
  selector:
    app: iot-stat-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: iot-stat-frontend-ui
  namespace: iot-system
spec:
  selector:
    app: iot-stat-frontend
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31900
