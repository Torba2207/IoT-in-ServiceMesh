apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: iot-stat-frontend-http
  namespace: iot-system
spec:
  podSelector:
    matchLabels:
      app: iot-stat-frontend
  port: 80
  proxyProtocol: HTTP/1
---
# Allow external (NodePort / non-meshed) traffic to reach the web UI
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: iot-stat-frontend-external
  namespace: iot-system
spec:
  networks:
    - cidr: 0.0.0.0/0
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: allow-external-to-iot-stat-frontend
  namespace: iot-system
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: iot-stat-frontend-http
  requiredAuthenticationRefs:
    - kind: NetworkAuthentication
      group: policy.linkerd.io
      name: iot-stat-frontend-external
