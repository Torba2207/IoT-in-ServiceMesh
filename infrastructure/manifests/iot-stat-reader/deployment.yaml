apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-stat-reader
  namespace: iot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-stat-reader
  namespace: iot-system
  labels:
    app: iot-stat-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-stat-reader
  template:
    metadata:
      labels:
        app: iot-stat-reader
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: iot-stat-reader
      containers:
        - name: iot-stat-reader
          image: ghcr.io/torba2207/iot-stat-reader:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iot-stat-reader
  namespace: iot-system
spec:
  selector:
    app: iot-stat-reader
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: iot-stat-reader-ui
  namespace: iot-system
spec:
  selector:
    app: iot-stat-reader
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 31800
