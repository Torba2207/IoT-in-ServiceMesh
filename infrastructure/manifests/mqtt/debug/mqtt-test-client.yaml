apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqtt-client
  namespace: iot-system
---
apiVersion: v1
kind: Pod
metadata:
  name: mqtt-client
  namespace: iot-system
  labels:
    app: mqtt-client
spec:
  serviceAccountName: mqtt-client
  restartPolicy: Never
  containers:
    - name: mqtt-client
      image: eclipse-mosquitto:2
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
          ephemeral-storage: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "128Mi"
