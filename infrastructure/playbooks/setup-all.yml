---
# Full bring-up of the IoT service-mesh platform.
#
# Runs locally against the cluster using your configured kubectl + linkerd CLI
# (no SSH / manifest-copy to the control plane). Order:
#   1. Linkerd (CRDs + control plane)
#   2. Linkerd Viz (metrics/tap dashboard)
#   3. iot-system namespace (deny-by-default) + Viz authorization policy
#   4. ArgoCD
#   5. Register every Application -> ArgoCD syncs all services from git
#
# Override binaries with: -e kubectl_bin=... -e linkerd_bin=...
- name: Set up Linkerd, Linkerd Viz, ArgoCD and sync all services
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubectl_bin: kubectl
    linkerd_bin: linkerd
    manifests_dir: "{{ playbook_dir }}/../manifests"
    argocd_apps: "{{ playbook_dir }}/../argocd/apps.yaml"
    ns_manifest: "{{ playbook_dir }}/../manifests/bootstrap/iot-system-namespace.yaml"
    viz_policy: "{{ playbook_dir }}/../manifests/observability/linkerd-viz-policy.yaml"
    env_file: "{{ playbook_dir }}/../../.env"
    argocd_install_url: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"
    argocd_apps_list:
      - chirpstack
      - mqtt
      - nodered
      - iot-stat-reader
      - iot-stat-frontend

  tasks:
    # ---------------- Preflight ----------------
    - name: Preflight - kubectl can reach the cluster
      ansible.builtin.command: "{{ kubectl_bin }} cluster-info"
      changed_when: false

    - name: Preflight - linkerd CLI is available
      ansible.builtin.command: "{{ linkerd_bin }} version --client --short"
      changed_when: false

    # ---------------- Linkerd ----------------
    - name: Install Linkerd CRDs
      ansible.builtin.shell: "set -o pipefail; {{ linkerd_bin }} install --crds | {{ kubectl_bin }} apply -f -"
      args: { executable: /bin/bash }
      register: lk_crds
      changed_when: "'created' in lk_crds.stdout or 'configured' in lk_crds.stdout"

    - name: Install Linkerd control plane
      ansible.builtin.shell: "set -o pipefail; {{ linkerd_bin }} install | {{ kubectl_bin }} apply -f -"
      args: { executable: /bin/bash }
      register: lk_cp
      changed_when: "'created' in lk_cp.stdout or 'configured' in lk_cp.stdout"

    - name: Wait for Linkerd control plane to be healthy
      ansible.builtin.command: "{{ linkerd_bin }} check"
      changed_when: false

    # ---------------- Linkerd Viz ----------------
    - name: Install Linkerd Viz
      ansible.builtin.shell: "set -o pipefail; {{ linkerd_bin }} viz install | {{ kubectl_bin }} apply -f -"
      args: { executable: /bin/bash }
      register: lk_viz
      changed_when: "'created' in lk_viz.stdout or 'configured' in lk_viz.stdout"

    - name: Wait for Linkerd Viz to be healthy
      ansible.builtin.command: "{{ linkerd_bin }} check"
      changed_when: false

    # ---------------- iot-system namespace + Viz policy ----------------
    - name: Create iot-system namespace (deny-by-default, meshed)
      ansible.builtin.command: "{{ kubectl_bin }} apply -f {{ ns_manifest }}"
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout or 'configured' in ns_apply.stdout"

    - name: Apply Linkerd Viz authorization policy (allow Prometheus + Tap through deny)
      ansible.builtin.command: "{{ kubectl_bin }} apply -f {{ viz_policy }}"
      register: viz_pol
      changed_when: "'created' in viz_pol.stdout or 'configured' in viz_pol.stdout"

    # ---------------- ChirpStack API secret (kept out of git) ----------------
    # The chirpstack Deployment mounts chirpstack-secret (CHIRPSTACK__API__SECRET).
    # It is sourced from the gitignored .env, so ArgoCD can't supply it — we
    # must create it before ArgoCD brings ChirpStack up, or its pod gets stuck
    # in CreateContainerConfigError.
    - name: Check the .env file exists (holds CHIRPSTACK_API_SECRET)
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat

    - name: Fail with a clear message if .env is missing
      ansible.builtin.fail:
        msg: "{{ env_file }} not found — it must define CHIRPSTACK_API_SECRET=<value> (the file is gitignored)."
      when: not env_stat.stat.exists

    - name: Create chirpstack-secret from .env
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl_bin }} create secret generic chirpstack-secret \
          --namespace=iot-system \
          --from-literal=api-secret='{{ lookup("file", env_file) | regex_search("CHIRPSTACK_API_SECRET=(.+)", "\1") | first }}' \
          --dry-run=client -o yaml | {{ kubectl_bin }} apply -f -
      args: { executable: /bin/bash }
      register: cs_secret
      changed_when: "'created' in cs_secret.stdout or 'configured' in cs_secret.stdout"

    # ---------------- ArgoCD ----------------
    - name: Ensure argocd namespace exists
      ansible.builtin.shell: "set -o pipefail; {{ kubectl_bin }} create namespace argocd --dry-run=client -o yaml | {{ kubectl_bin }} apply -f -"
      args: { executable: /bin/bash }
      register: argocd_ns
      changed_when: "'created' in argocd_ns.stdout"

    - name: Install ArgoCD (stable manifest)
      ansible.builtin.command: "{{ kubectl_bin }} apply -n argocd -f {{ argocd_install_url }}"
      register: argocd_install
      changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"

    - name: Wait for ArgoCD core components to be ready
      ansible.builtin.command: "{{ kubectl_bin }} -n argocd rollout status {{ item }} --timeout=300s"
      loop:
        - deploy/argocd-server
        - deploy/argocd-repo-server
        - statefulset/argocd-application-controller
      changed_when: false

    # ---------------- Register & sync the services ----------------
    - name: Register all ArgoCD Applications
      ansible.builtin.command: "{{ kubectl_bin }} apply -f {{ argocd_apps }}"
      register: apps_apply
      changed_when: "'created' in apps_apply.stdout or 'configured' in apps_apply.stdout"

    - name: Trigger an immediate sync for each Application (skip the poll wait)
      ansible.builtin.command: >-
        {{ kubectl_bin }} -n argocd patch application {{ item }}
        --type merge -p '{"operation":{"sync":{}}}'
      loop: "{{ argocd_apps_list }}"
      changed_when: false

    - name: Wait for every Application to become Synced and Healthy
      ansible.builtin.command: >-
        {{ kubectl_bin }} -n argocd get application {{ item }}
        -o jsonpath={.status.sync.status}/{.status.health.status}
      register: app_state
      until: app_state.stdout == "Synced/Healthy"
      retries: 30
      delay: 10
      loop: "{{ argocd_apps_list }}"
      changed_when: false

    # ---------------- Summary ----------------
    - name: Show ArgoCD application status
      ansible.builtin.command: "{{ kubectl_bin }} get applications -n argocd"
      register: final_apps
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg:
          - "{{ final_apps.stdout_lines }}"
          - "Platform is up. Exposed UIs (NodePort on any node IP, e.g. 10.29.16.101):"
          - "  chirpstack-ui      :30080"
          - "  nodered            :31880"
          - "  iot-stat-reader    :31800"
          - "  iot-stat-frontend  :31900"
          - "  gateway-bridge-udp :31700/UDP"
